    <style>
        :root {
            --bg-color: #070b15;
            --card-bg: #121a2e;
            --text-main: #e6f1ff;
            --text-muted: #8aa0c8;
            --accent: #00e0ff;
            --correct: #39ff8b;
            --wrong: #ff4d6d;
            --border: rgba(120, 180, 255, 0.2);
            --border-radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .top-bar { display: flex; justify-content: space-between; width: 100%; max-width: 800px; background: linear-gradient(135deg, #1c2a50, #0e142a); border: 1px solid var(--border); padding: 15px 25px; border-radius: var(--border-radius); margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .stat-item { display: flex; flex-direction: column; align-items: center; font-size: 14px; font-weight: bold; color: var(--text-muted); }
        .stat-value { font-size: 22px; margin-top: 5px; }
        .val-total { color: var(--accent); } .val-correct { color: var(--correct); } .val-wrong { color: var(--wrong); }
        .quiz-container { width: 100%; max-width: 800px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--border-radius); padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .q-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
        .q-text { font-size: 20px; line-height: 1.6; margin-bottom: 25px; direction: ltr; text-align: left; font-weight: 600; }
        .options { display: grid; gap: 12px; direction: ltr; }
        .option-btn { background: rgba(10,16,32,0.7); border: 1px solid var(--border); color: var(--text-main); padding: 16px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; text-align: left; transition: 0.2s; }
        .option-btn:hover:not(:disabled) { background: rgba(0,224,255,0.1); border-color: var(--accent); }
        .option-btn.correct { background: rgba(57,255,139,0.15); border-color: var(--correct); color: #d6ffe6; }
        .option-btn.wrong { background: rgba(255,77,109,0.15); border-color: var(--wrong); color: #ffd6df; }
        .explanation { display: none; margin-top: 25px; padding: 20px; background: rgba(10,16,32,0.8); border: 1px solid var(--accent); border-right: 5px solid var(--accent); border-radius: 8px; line-height: 1.8; font-size: 15px; }
        .explanation.show { display: block; animation: fadeIn 0.4s ease; }
        .explanation h4 { color: var(--accent); margin-bottom: 10px; }
        .actions { margin-top: 30px; display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 20px; }
        .btn { border: none; padding: 12px 25px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; }
        .btn-next { background: linear-gradient(90deg, #00e0ff, #7c5cff); }
        .btn-prev { background: rgba(255,255,255,0.1); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

                "explanation": "<b>1. الفهم:</b> بما إن السؤال ليه 4 اختيارات وهو بيخمن (بيختار عشوائي)، إذن احتمال الإجابة الصح (p) = 1/4 = 0.25. والخطأ (q) = 0.75.<br><b>2. المعطيات:</b> n = 10 أسئلة، المطلوب k = 2 صح.<br><b>3. التعويض:</b> P(X=2) = 10C2 × (0.25)^2 × (0.75)^8.<br><b>4. الحساب:</b> 45 × 0.0625 × 0.10011 ≈ 0.28156... ≈ <b>0.2816</b>."

                "options": ["P(4) = (7^4)(e^(−7))/4!", "P(4) = (4^7)(e^(−4))/7!", "P(4) = (7^4)(e^(−4))/4!", "P(4) = (7)(e^(−7))/4!"], "answer": 0,
                "explanation": "<b>1. الفهم:</b> قانون بواسون بيحسب احتمالية حدوث عدد معين (x) في فترة زمنية لو كنا عارفين المتوسط (λ).<br><b>2. التعويض:</b> هو قال λ = 7، وعايز x = 4.<br><b>3. النتيجة:</b> بنشيل كل λ نحط 7 ونشيل x نحط 4 في القانون: <b>P(4) = (7^4)(e^(−7))/4!</b>."
            },
            {
                "id": 321, "topic": "Normal Distribution", "type": "mcq",
                "question": "Speeds at a checkpoint are normally distributed with μ = 61 mph and σ = 4 mph. What is the z-score for x = 65 mph?",
                "options": ["0.50", "1.00", "1.25", "-1.00"], "answer": 1,
                "explanation": "<b>1. القانون:</b> القيمة المعيارية (z-score) = (القيمة x - المتوسط μ) ÷ الانحراف المعياري σ.<br><b>2. التعويض:</b> z = (65 - 61) ÷ 4.<br><b>3. الحساب:</b> z = 4 ÷ 4 = <b>1.00</b>."
            },
            {
                "id": 322, "topic": "Normal Distribution", "type": "mcq",
                "question": "Speeds at a checkpoint are normally distributed with μ = 61 mph and σ = 4 mph. Given that the area between the mean and z = 1.25 is 0.3944, what is the probability that the next car is traveling more than 66 mph?",
                "options": ["0.1056", "0.3944", "0.5000", "0.8944"], "answer": 0,
                "explanation": "<b>1. نحسب الـ Z أولاً للسرعة 66:</b> z = (66 - 61) ÷ 4 = 5 ÷ 4 = 1.25.<br><b>2. الفهم من الجدول:</b> هو مديك إن المساحة من النص (المتوسط) لحد الـ Z دي = 0.3944.<br><b>3. المطلوب (أكثر من 66):</b> يعني عايز الديل اليمين (اللي فوق). بما إن النص اليمين كله 0.5، هنطرح منه المساحة دي.<br><b>4. الحساب:</b> 0.5 - 0.3944 = <b>0.1056</b>."
            },
            {
                "id": 323, "topic": "Normal Distribution", "type": "mcq",
                "question": "Speeds at a checkpoint are normally distributed with μ = 61 mph and σ = 4 mph. Given P(0 < z < 0.50) = 0.1915, what is P(x < 59)?",
                "options": ["0.1915", "0.3085", "0.6915", "0.5000"], "answer": 1,
                "explanation": "<b>1. نحسب الـ Z للـ 59:</b> z = (59 - 61) ÷ 4 = -2 ÷ 4 = -0.50.<br><b>2. الفهم:</b> المساحة من النص لـ -0.5 هي نفسها من النص لـ 0.5 (لأن المنحنى متماثل) = 0.1915.<br><b>3. المطلوب (أقل من 59):</b> يعني الديل الشمال الخالص. النص الشمال كله 0.5.<br><b>4. الحساب:</b> 0.5 - 0.1915 = <b>0.3085</b>."

                "id": 324, "topic": "Normal Distribution", "type": "mcq",
                "question": "Home selling prices are normally distributed with μ = $276,000 and σ = $32,000. Using P(−0.81 < z < 0) = 0.2910 and P(0 < z < 2.31) = 0.4896, what is P(250,000 < x < 350,000)?",
                "options": ["0.4896", "0.2910", "0.7806", "0.1986"], "answer": 2,
                "explanation": "<b>1. التفكير:</b> هو عايز الاحتمال من 250,000 (ودي تحت المتوسط) لحد 350,000 (ودي فوق المتوسط).<br><b>2. الفهم:</b> القيمة 250k الـ z بتاعها بيطلع -0.81 (زي المعطيات). والقيمة 350k الـ z بتاعها 2.31.<br><b>3. المطلوب:</b> بما إن القيمتين واحدة شمال النص وواحدة يمينه، بنجمع المساحتين اللي هو إداهملنا جاهزين.<br><b>4. الحساب:</b> 0.2910 + 0.4896 = <b>0.7806</b>."
            },
            {
                "id": 325, "topic": "Normal Distribution", "type": "mcq",
                "question": "Customers' ages at a retail store are normally distributed with μ = 37.5 years and σ = 7.6 years. Given P(0 < z < 1.38) = 0.4162, what is the probability that a randomly selected customer is older than 48?",
                "options": ["0.4162", "0.0838", "0.5838", "0.9162"], "answer": 1,
                "explanation": "<b>1. نحسب الـ Z:</b> z = (48 - 37.5) ÷ 7.6 = 10.5 ÷ 7.6 ≈ 1.38.<br><b>2. المطلوب:</b> هو عايز الاحتمال إن العميل يكون <b>أكبر من 48</b> (یعنی أكبر من z=1.38). ده الديل اليمين للمنحنى.<br><b>3. الحساب:</b> المساحة اليمين كلها 0.5. نطرح منها المساحة لحد 1.38 اللي هي 0.4162.<br><b>4. النتيجة:</b> 0.5 - 0.4162 = <b>0.0838</b>."

            {
                "id": 326, "topic": "Normal Distribution", "type": "mcq",
                "question": "A homebuilder's completion times are normally distributed with μ = 176.7 days and σ = 24.8 days. Using z = 1.65 for a 95% probability, what completion time x can the builder achieve with 95% probability?",
                "options": ["x ≈ 200.5 days", "x ≈ 217.62 days", "x ≈ 176.7 days", "x ≈ 152.0 days"], "answer": 1,
                "explanation": "<b>1. الفهم (سؤال عكسي):</b> المرة دي هو مديك الـ z (1.65) وعايزك تجيب القيمة الأصلية x (المدة بالأيام).<br><b>2. القانون (تعديل لـ z-score):</b> x = μ + (z × σ).<br><b>3. التعويض:</b> x = 176.7 + (1.65 × 24.8).<br><b>4. الحساب:</b> 176.7 + 40.92 = <b>217.62</b> أيام."

        ];

        let currentIdx = 0; let right = 0; let wrong = 0; let answers = {};

        function nav(step) { currentIdx += step; showQ(currentIdx); }
        function showQ(i) {
            document.getElementById('ui-cur').innerText = i + 1;
            document.getElementById('btn-prev').disabled = i === 0;
            document.getElementById('btn-next').disabled = true;
            document.getElementById('explanation').classList.remove('show');
            const q = QUESTIONS[i];
            document.getElementById('q-topic').innerText = `الموضوع: ${q.topic}`;
            document.getElementById('q-id').innerText = `سؤال #${q.id}`;
            document.getElementById('q-text').innerText = q.question;
            const opts = document.getElementById('options'); opts.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt;
                btn.onclick = () => selectOpt(idx, btn, i); opts.appendChild(btn);
            });
            if (answers[i]) highlight(i);
        }
        function selectOpt(sel, btn, qIdx) {
            answers[qIdx] = { sel: sel, correct: sel === QUESTIONS[qIdx].answer };
            answers[qIdx].correct ? document.getElementById('ui-correct').innerText = ++right : document.getElementById('ui-wrong').innerText = ++wrong;
            highlight(qIdx);
        }
        function highlight(i) {
            const q = QUESTIONS[i]; const btns = document.getElementById('options').children;
            for (let btn of btns) btn.disabled = true;
            btns[q.answer].classList.add('correct');
            if (answers[i].sel !== q.answer) btns[answers[i].sel].classList.add('wrong');
            document.getElementById('exp-text').innerHTML = q.explanation;
            document.getElementById('explanation').classList.add('show');
            document.getElementById('btn-next').disabled = (i === QUESTIONS.length - 1);
        }
        window.onload = () => showQ(currentIdx);
    </script>
