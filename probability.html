<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار التفاعلي الشامل</title>
    <style>
        :root {
            --bg-color: #070b15;
            --card-bg: rgba(18, 26, 46, 0.9);
            --text-main: #e6f1ff;
            --text-muted: #8aa0c8;
            --accent: #00e0ff;
            --correct: #39ff8b;
            --wrong: #ff4d6d;
            --border: rgba(120, 180, 255, 0.2);
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* شريط الإحصائيات العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            background: linear-gradient(135deg, rgba(28,42,80,0.8) 0%, rgba(14,20,42,0.8) 100%);
            border: 1px solid var(--border);
            padding: 15px 25px;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: bold;
        }

        .stat-value {
            font-size: 24px;
            margin-top: 5px;
        }

        .val-correct { color: var(--correct); text-shadow: 0 0 10px rgba(57,255,139,0.4); }
        .val-wrong { color: var(--wrong); text-shadow: 0 0 10px rgba(255,77,109,0.4); }
        .val-total { color: var(--accent); text-shadow: 0 0 10px rgba(0,224,255,0.4); }

        /* حاوية السؤال */
        .quiz-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .question-meta {
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 22px;
            line-height: 1.5;
            margin-bottom: 25px;
            direction: ltr; /* لأن محتوى الأسئلة بالإنجليزية */
            text-align: left;
        }

        .options-grid {
            display: grid;
            gap: 15px;
            direction: ltr;
        }

        .option-btn {
            background: rgba(10, 16, 32, 0.6);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 224, 255, 0.1);
            border-color: var(--accent);
            transform: translateX(5px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* حالات الإجابة */
        .option-btn.correct {
            background: rgba(57, 255, 139, 0.15);
            border-color: var(--correct);
            color: #d6ffe6;
            box-shadow: 0 0 15px rgba(57,255,139,0.2);
        }

        .option-btn.wrong {
            background: rgba(255, 77, 109, 0.15);
            border-color: var(--wrong);
            color: #ffd6df;
            box-shadow: 0 0 15px rgba(255,77,109,0.2);
        }

        /* صندوق الشرح والتفسير */
        .explanation-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: rgba(0, 224, 255, 0.05);
            border-right: 4px solid var(--accent);
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            animation: fadeIn 0.4s ease;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-title {
            color: var(--accent);
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* أزرار التحكم */
        .actions {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background: linear-gradient(90deg, #00e0ff, #7c5cff);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            display: none;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        </div>

        <div class="actions">

        </div>
    </div>

        // المتغيرات لحفظ الحالة
        let currentIndex = 0;
        let correctAnswers = 0;
        let wrongAnswers = 0;

        // مراجع لعناصر الواجهة
        const uiCurrent = document.getElementById('ui-current');
        const uiTotal = document.getElementById('ui-total');
        const uiCorrect = document.getElementById('ui-correct');
        const uiWrong = document.getElementById('ui-wrong');
        const qMeta = document.getElementById('q-meta');
        const qText = document.getElementById('q-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationContainer = document.getElementById('explanation-container');
        const explanationText = document.getElementById('explanation-text');
        const nextBtn = document.getElementById('next-btn');

        // تهيئة الاختبار
        function initQuiz() {
            uiTotal.textContent = QUESTIONS.length;
            loadQuestion(currentIndex);
        }

        // دالة عرض السؤال
        function loadQuestion(index) {
            const q = QUESTIONS[index];
            
            // تحديث العدادات
            uiCurrent.textContent = index + 1;
            
            // إخفاء الشرح وزر التالي
            explanationContainer.classList.remove('show');
            nextBtn.style.display = 'none';
            
            // عرض بيانات السؤال
            qMeta.textContent = `Topic: ${q.topic} | Source: ${q.source}`;
            qText.textContent = q.question;
            
            // توليد الخيارات
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => selectAnswer(i, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // دالة معالجة الإجابة عند الضغط عليها
        function selectAnswer(selectedIndex, selectedBtn) {
            const q = QUESTIONS[currentIndex];
            const correctIndex = q.answer;
            const isCorrect = (selectedIndex === correctIndex);

            // تعطيل جميع الأزرار بعد الاختيار
            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                // إجابة صحيحة
                selectedBtn.classList.add('correct');
                correctAnswers++;
                uiCorrect.textContent = correctAnswers;
            } else {
                // إجابة خاطئة
                selectedBtn.classList.add('wrong');
                // تظليل الإجابة الصحيحة باللون الأخضر ليعرفها الطالب
                allBtns[correctIndex].classList.add('correct');
                wrongAnswers++;
                uiWrong.textContent = wrongAnswers;
            }

            // عرض الشرح بالتفصيل
            let explanation = q.explanation;
            if (!explanation || explanation.trim() === "") {
                explanation = `الإجابة الصحيحة هي: ${q.options[correctIndex]}. راجع القوانين الخاصة بـ ${q.topic} لتفاصيل أكثر.`;
            }
            explanationText.innerHTML = explanation;
            explanationContainer.classList.add('show');

            // إظهار زر الانتقال للسؤال التالي
            nextBtn.style.display = 'block';
        }

        // دالة الانتقال للسؤال التالي
        function loadNextQuestion() {
            if (currentIndex < QUESTIONS.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                // نهاية الاختبار
                qText.innerHTML = `<span style="color:var(--correct)">🎉 مبروك! لقد أنهيت الاختبار بالكامل.</span>`;
                qMeta.textContent = "Test Completed";
                optionsContainer.innerHTML = '';
                explanationContainer.classList.remove('show');
                nextBtn.style.display = 'none';
            }
        }

        // تشغيل المنصة فور تحميل الصفحة
        window.onload = initQuiz;

    </script>
