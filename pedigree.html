<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Pedigree Analysis Quiz</title>
<style>
  :root{--bg:#05060f;--panel:rgba(18,24,52,0.65);--border:rgba(120,180,255,0.18);--cyan:#22d3ee;--purple:#a855f7;--good:#10b981;--bad:#ef4444;--text:#e6edff;--muted:#9aa6c7;--grad:linear-gradient(135deg,#22d3ee,#a855f7);--glow:0 0 20px rgba(34,211,238,0.2);}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
  body{background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:40px 20px;min-height:100vh; line-height: 1.6;}
  .box{width:100%;max-width:800px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:var(--glow); height: fit-content;}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:15px;}
  .head h1{font-size:1.5rem;background:var(--grad);-webkit-background-clip:text;color:transparent;}
  .prog{height:8px;background:rgba(255,255,255,0.1);border-radius:10px;margin-bottom:20px;overflow:hidden;}
  .fill{height:100%;width:0%;background:var(--grad);transition:0.4s;}
  .q-text{font-size:1.2rem;font-weight:600;margin-bottom:20px;}
  .opt{padding:15px;border-radius:12px;border:1px solid var(--border);background:rgba(10,15,36,0.6);margin-bottom:10px;cursor:pointer;transition:0.2s;}
  .opt:hover:not(.dis){border-color:var(--cyan);background:rgba(34,211,238,0.1);}
  .opt.c{border-color:var(--good);background:rgba(16,185,129,0.2);color:#a7f3d0;}
  .opt.w{border-color:var(--bad);background:rgba(239,68,68,0.2);color:#fecaca;}
  .opt.dis{pointer-events:none;}
  .exp{margin-top:15px;padding:15px;border-radius:12px;background:rgba(34,211,238,0.08);border-left:4px solid var(--cyan);display:none;}
  .exp.show{display:block;animation:fadeIn 0.4s;}
  .btn{padding:10px 20px;border-radius:10px;background:var(--grad);color:#000;font-weight:bold;border:none;cursor:pointer;display:none;margin-top:20px;float:right;}
  .btn.show{display:inline-block;}
  .res{text-align:center;display:none;}
  .res h2{font-size:2.5rem;margin-bottom:10px;background:var(--grad);-webkit-background-clip:text;color:transparent;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="box" id="app">
  <div id="quiz">
    <div class="head"><h1>📊 Pedigree Analysis Quiz</h1><div id="stats" style="color:var(--muted); font-weight:bold;">Score: 0 | Q: 1/22</div></div>
    <div class="prog"><div class="fill" id="fill"></div></div>
    <div class="q-text" id="qtext"></div>
    <div id="opts"></div>
    <div class="exp" id="exp"></div>
    <button class="btn" id="next">Next ➔</button>
  </div>
  <div class="res" id="res">
    <h2>🎉 Complete!</h2><p style="font-size: 1.2rem; color: var(--muted); margin-bottom: 20px;">Score: <span id="fscore" style="color:#fff; font-weight:bold;"></span> / <span id="tscore"></span></p>
    <button class="btn show" style="float:none;" onclick="location.reload()">🔄 Restart Quiz</button>
  </div>
</div>
<script>
  const data = [
    {q:"Two unaffected parents have an affected child. The most likely mode of inheritance is:",o:["Autosomal dominant","Autosomal recessive","Y-linked","Mitochondrial"],a:1,e:"Two unaffected → affected child indicates a recessive pedigree (Rr × Rr → rr)."},
    {q:"In an X-linked recessive pedigree, which is TRUE?",o:["Affected fathers pass the trait to all sons","Trait is more common in females","Affected fathers do NOT pass the trait to their sons","Trait is found in every generation"],a:2,e:"Sons inherit Y from father; XR is passed mother → son through carrier mothers."},
    {q:"Which is an example of an autosomal dominant disorder mentioned in the lecture?",o:["PKU","Cystic fibrosis","Huntington's disease","Hemophilia"],a:2,e:"Huntington's disease is the classic AD example (Venezuelan village of Barranquitas)."},
    {q:"The outsider rule for autosomal dominant pedigrees states that an affected outsider is assumed to be:",o:["DD","Dd","dd","Cannot be determined"],a:1,e:"Affected outsiders in AD are assumed heterozygous (Dd) because the disease allele is rare."},
    {q:"Unaffected children of an Rr × Rr cross have what genotype ratio?",o:["1/2 RR : 1/2 Rr","2/3 Rr : 1/3 RR","1/3 Rr : 2/3 RR","All Rr"],a:1,e:"Conditioning on unaffected removes rr; remaining 1 RR : 2 Rr → 1/3 : 2/3."},
    {q:"A consanguineous mating in a pedigree is shown by:",o:["A diagonal line through a shape","A single horizontal line","A double horizontal line","A diamond shape"],a:2,e:"Double horizontal line denotes consanguineous (related) mating."},
    {q:"Which pattern is diagnostic of mitochondrial inheritance?",o:["Father → all sons","Mother → all offspring; father → none","Skipping generations","All daughters of affected fathers affected"],a:1,e:"Mitochondria are maternally inherited; males never transmit."},
    {q:"Trait in every generation with ~½ of children of affected parents being affected suggests:",o:["Autosomal recessive","Autosomal dominant","X-linked recessive","Mitochondrial"],a:1,e:"AD: every generation, ~½ transmission regardless of sex."},
    {q:"Why are Punnett squares & chi-square tests insufficient for human genetic analysis?",o:["Humans don't follow Mendelian rules","Small families and uncontrolled matings","Diseases are too rare","DNA is too complex"],a:1,e:"Lecture: small families (≤20), uncontrolled heterozygous matings, uncertain parentage."},
    {q:"The proband in a pedigree is shown by:",o:["A diamond","An arrow","A diagonal line","A filled square"],a:1,e:"Arrow points to the proband — the affected individual through whom the family is ascertained."},
    {q:"Achondroplasia is an example of:",o:["X-linked dominant","Autosomal dominant","Autosomal recessive","Mitochondrial"],a:1,e:"Achondroplasia is a rare autosomal dominant skeletal disorder (dwarfism)."},
    {q:"Affected children of an affected and an unaffected parent in a dominant pedigree must be:",o:["DD","Dd","dd","Either DD or Dd"],a:1,e:"They received d from the unaffected (dd) parent and D from the affected parent → Dd."},
    {q:"In recessive pedigrees, an unaffected outsider is assumed to be:",o:["Rr","rr","RR","Indeterminate"],a:2,e:"Recessive outsider rule: unaffected outsiders assumed RR (rare disease allele)."},
    {q:"Parent A is ½ DD and ½ Dd; Parent B is dd. P(affected offspring)?",o:["1/2","2/3","3/4","1"],a:2,e:"(½×1) + (½×½) = 3/4 — the lecture's worked example."},
    {q:"Which is TRUE of X-linked dominant inheritance?",o:["Affected fathers pass to all sons","Affected fathers pass to all daughters","Males are never affected","Only carrier females exist"],a:1,e:"XD diagnostic: every daughter of an affected father inherits the X carrying the dominant allele."},
    {q:"Y-linked traits are best described as:",o:["Passed mother → daughter only","Passed father → all sons; never in females","Skipping generations","Recessive in females"],a:1,e:"Y-linked genes are hemizygous in males; transmitted father → all sons; absent in females."},
    {q:"Among affected offspring of Dd × Dd, what is the ratio?",o:["1 DD : 1 Dd","2/3 Dd : 1/3 DD","All Dd","1/3 Dd : 2/3 DD"],a:1,e:"Affected = DD or Dd in ratio 1:2 → 1/3 DD : 2/3 Dd."},
    {q:"Two affected parents have an unaffected child. The pedigree is:",o:["Recessive","Dominant","X-linked","Indeterminate"],a:1,e:"Only possible in dominant (Dd × Dd) → dd unaffected child."},
    {q:"Why is the trait commonly seen in only ½ of an AR village population a misleading clue?",o:["Because AR is always rare in populations","Because allele frequency in population can be high even if AR","Because AR cannot affect females","Because AR is sex-linked"],a:1,e:"Lecture: recessive traits may be common in a population even though dominant traits may be rare."},
    {q:"Combine probabilities for two events that must BOTH occur using:",o:["OR rule (addition)","AND rule (multiplication)","Bayes only","Subtraction"],a:1,e:"AND = multiply within a scenario; OR = add across mutually exclusive scenarios."},
    {q:"A pedigree shows a trait passed only through female lines to both sons and daughters. Which inheritance fits?",o:["Autosomal recessive","X-linked dominant","Mitochondrial","Y-linked"],a:2,e:"Mitochondrial: mothers transmit to ALL offspring; fathers never transmit."},
    {q:"Which is NOT a reason an individual may seek genetic testing according to the lecture?",o:["Family history of a specific disease","Symptoms of a genetic disorder","Concern about passing the disorder to children","Routine annual physical screening"],a:3,e:"Lecture lists family history, symptoms, and reproductive concern — not routine screening."}
  ];
  let i=0, s=0, ans=false;
  const $=(id)=>document.getElementById(id);
  function load(){
    ans=false; $('next').classList.remove('show'); $('exp').classList.remove('show');
    $('stats').innerText=`Score: ${s} | Q: ${i+1}/${data.length}`;
    $('fill').style.width=`${(i/data.length)*100}%`;
    $('qtext').innerText=`Q${i+1}. `+data[i].q;
    $('opts').innerHTML='';
    data[i].o.forEach((o,j)=>{
      let d=document.createElement('div'); d.className='opt'; d.innerHTML=`<b>${String.fromCharCode(65+j)}.</b> ${o}`;
      d.onclick=()=>check(j); $('opts').appendChild(d);
    });
    $('exp').innerHTML=`<b>💡 Explanation:</b> ${data[i].e}`;
  }
  function check(j){
    if(ans)return; ans=true;
    let os=$('opts').children;
    for(let k=0;k<os.length;k++){
      os[k].classList.add('dis');
      if(k===data[i].a) os[k].classList.add('c');
      else if(k===j) os[k].classList.add('w');
    }
    if(j===data[i].a) s++;
    $('exp').classList.add('show');
    $('next').innerText = i===data.length-1 ? 'Results 🏁' : 'Next ➔';
    $('next').classList.add('show');
    $('stats').innerText=`Score: ${s} | Q: ${i+1}/${data.length}`;
  }
  $('next').onclick=()=>{
    if(i<data.length-1){ i++; load(); }
    else{ $('quiz').style.display='none'; $('res').style.display='block'; $('fscore').innerText=s; $('tscore').innerText=data.length; }
  };
  load();
</script>
</body>
</html>
