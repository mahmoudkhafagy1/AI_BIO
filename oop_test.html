<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O&P Test - Data Structures & C</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --panel: #12131c;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ea;
            --text: #e0e6ed;
        }
        body {
            background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;
            box-sizing: border-box;
        }
        .quiz-container {
            background: var(--panel); padding: 30px; border-radius: 12px; width: 100%; max-width: 700px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15); border: 1px solid rgba(0, 243, 255, 0.3); position: relative;
        }
        h2 { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); text-align: center; margin-bottom: 30px; }
        .question { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.5; }
        .option {
            background: rgba(255, 255, 255, 0.03); padding: 15px; margin: 12px 0; border-radius: 6px;
            cursor: pointer; transition: all 0.3s ease; border: 1px solid transparent; font-size: 1rem;
        }
        .option:hover { border-color: var(--neon-pink); box-shadow: 0 0 10px rgba(255, 0, 234, 0.4); transform: translateX(5px); }
        .option.correct { background: rgba(0, 255, 0, 0.1); border-color: #0f0; box-shadow: 0 0 12px #0f0; }
        .option.wrong { background: rgba(255, 0, 0, 0.1); border-color: #f00; box-shadow: 0 0 12px #f00; }
        .option.disabled { pointer-events: none; }
        #next-btn {
            background: transparent; color: var(--neon-cyan); border: 2px solid var(--neon-cyan);
            padding: 12px 20px; border-radius: 6px; cursor: pointer; display: none; width: 100%;
            font-size: 1.1rem; font-weight: bold; margin-top: 25px; transition: 0.3s; text-transform: uppercase;
        }
        #next-btn:hover { background: var(--neon-cyan); color: var(--bg); box-shadow: 0 0 15px var(--neon-cyan); }
        #score-board { text-align: center; display: none; }
        .progress { color: var(--neon-pink); text-shadow: 0 0 5px var(--neon-pink); font-size: 0.9rem; margin-bottom: 15px; text-align: right; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="progress" id="progress">Question 1 of 20</div>
    <h2 id="quiz-title">O&P Test Quiz</h2>
    <div id="quiz-body">
        <div class="question" id="question">Loading...</div>
        <div id="options"></div>
    </div>
    <button id="next-btn" onclick="nextQuestion()">Next Question</button>
    <div id="score-board">
        <h2 id="final-score"></h2>
        <button id="next-btn" style="display:block;" onclick="location.reload()">Restart Quiz</button>
    </div>
</div>

<script>
const quizData = [
    { q: "In a stack, if a user tries to remove an element from an empty stack it is called", o: ["Garbage Collection", "Underflow", "Overflow", "Empty collection"], a: 1 },
    { q: "Which of the following is not a valid C variable name?", o: ["float rate;", "int $main;", "int number;", "int variable_count;"], a: 1 },
    { q: "The following name does not relate to stacks", o: ["Piles", "Push down list", "FIFO lists", "LIFO lists"], a: 2 },
    { q: "A linked-list is a dynamic structure", o: ["False", "True"], a: 1 },
    { q: "Elements in an array are accessed", o: ["randomly", "sequentially", "exponentially", "logarithmically"], a: 0 },
    { q: "Pushing an element into stack already having five elements and stack size of 5, then stack becomes", o: ["Overflow", "Underflow", "Crash", "User flow"], a: 0 },
    { q: "The given array is arr = {1,2,4,3}. Bubble sort is used to sort the array elements. How many iterations will be done to sort the array?", o: ["6", "5", "3", "4"], a: 3 },
    { q: "A linear list of elements in which deletion can be done from one end (front) and insertion can take place only at the other end (rear) is known as", o: ["Tree", "Queue", "Stack", "Linked list"], a: 1 },
    { q: "What will be the number of passes to sort the following elements using insertion sort? 14, 12,16, 6, 3, 10", o: ["5", "6", "8", "7"], a: 0 },
    { q: "What are the advantages of arrays?", o: ["Elements in an array cannot be sorted", "Easier to store elements of same data type", "Objects of mixed data types can be stored", "Index of first element of an array is 1"], a: 1 },
    { q: "How do you initialize an array in C?", o: ["int arr(3) = {1,2,3};", "int arr[3] = (1,2,3);", "int arr(3) = (1,2,3);", "int arr[3] = {1,2,3};"], a: 3 },
    { q: "Process of removing an element from stack is called", o: ["Evaluation", "Pop", "Create", "Push"], a: 1 },
    { q: "Which of the following is linear data structure?", o: ["One dimention Array", "Graphs", "Trees", "None of these"], a: 0 },
    { q: "If the elements 'A', 'B', 'C' and 'D' are placed in a queue respectively, and are deleted one at a time, in what order will they be removed?", o: ["DCBA", "ABDC", "ABCD", "DCAB"], a: 2 },
    { q: "How many passes does an insertion sort algorithm consist of?", o: ["N+1", "N-2", "N-1", "N"], a: 2 },
    { q: "To represent hierarchical relatioship between elements, Which data structure is suitable?", o: ["queue", "Graph", "Stack", "Tree"], a: 3 },
    { q: "Which of the following data structures is linear type", o: ["Graph", "Stack", "Binary Tree", "Tree"], a: 1 },
    { q: "which of the following is non linear data structures", o: ["Stacks", "Strings", "Trees", "Lists"], a: 2 },
    { q: "A queue follows", o: ["LIFO (Last In First Out) principle", "FIFO (First In First Out) principle", "Linear tree", "Ordered array"], a: 1 },
    { q: "Entries in a stack are 'ordered'. What is the meaning of this statement?", o: ["The entries are stored in a linked list", "Stack entries may be compared with the '<' operation", "There is a Sequential entry that is one by one", "A collection of stacks is sortable"], a: 2 }
];

let currentQuestion = 0;
let score = 0;

function loadQuestion() {
    const q = quizData[currentQuestion];
    document.getElementById("progress").innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
    document.getElementById("question").innerText = `${currentQuestion + 1}. ${q.q}`;
    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";
    q.o.forEach((opt, index) => {
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt;
        div.onclick = () => selectOption(div, index, q.a);
        optionsDiv.appendChild(div);
    });
    document.getElementById("next-btn").style.display = "none";
}

function selectOption(element, selectedIndex, correctIndex) {
    const options = document.querySelectorAll(".option");
    options.forEach(opt => opt.classList.add("disabled"));
    
    if (selectedIndex === correctIndex) {
        element.classList.add("correct");
        score++;
    } else {
        element.classList.add("wrong");
        options[correctIndex].classList.add("correct");
    }
    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < quizData.length) {
        loadQuestion();
    } else {
        document.getElementById("quiz-title").style.display = "none";
        document.getElementById("progress").style.display = "none";
        document.getElementById("quiz-body").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("score-board").style.display = "block";
        document.getElementById("final-score").innerText = `Mission Accomplished!\nScore: ${score} / ${quizData.length}`;
    }
}

loadQuestion();
</script>
</body>
</html>
