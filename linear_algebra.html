<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI_BIO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        :root {
            --dark-bg: #0b0f19;
            --dark-card: #1a2235;
            --neon-green: #00ffcc;
            --neon-blue: #0088ff;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --correct-bg: rgba(34, 197, 94, 0.2);
            --correct-border: #22c55e;
            --wrong-bg: rgba(239, 68, 68, 0.2);
            --wrong-border: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .ar-text {
            font-family: 'Cairo', sans-serif;
        }

        .en-text {
            direction: ltr;
            text-align: left;
        }

        .quiz-container {
            background-color: var(--dark-card);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 136, 255, 0.2);
            border-radius: 16px;
            width: 100%;
            max-width: 850px;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .header-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .counters {
            display: flex;
            gap: 15px;
            font-weight: bold;
        }

        .correct-text { color: var(--correct-border); }
        .wrong-text { color: var(--wrong-border); }

        .question {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: transparent;
            color: var(--text-light);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            white-space: pre-wrap;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 136, 255, 0.3);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            border-color: var(--correct-border);
            background-color: var(--correct-bg);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
            opacity: 1;
        }

        .option-btn.wrong {
            border-color: var(--wrong-border);
            background-color: var(--wrong-bg);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            opacity: 1;
        }

        .rationale {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.5s;
        }

        .rationale.show {
            display: block;
        }

        .rationale-title {
            color: var(--neon-green);
            font-weight: bold;
            margin-bottom: 5px;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .nav-btn {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: none;
        }

        .nav-btn.show {
            display: block;
        }

        #next-btn {
            background-color: var(--neon-blue);
            color: var(--text-light);
        }

        #next-btn:hover {
            background-color: #3b82f6;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.6);
        }

        #prev-btn {
            background-color: #334155;
            color: var(--text-light);
        }

        #prev-btn:hover {
            background-color: #475569;
        }

        .result-container {
            text-align: center;
            display: none;
        }

        .result-container.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-container">
        <div class="header-line"></div>
        <h1> Linear Algebra</h1>
        
        <div id="quiz-content">
            <div class="stats en-text">
                <span id="question-tracker">Question 1 of 136</span>
                <div class="counters">
                    <span id="correct-tracker" class="correct-text">✅ Correct: 0</span>
                    <span id="wrong-tracker" class="wrong-text">❌ Wrong: 0</span>
                </div>
            </div>

            <div class="question en-text" id="question-text"></div>
            
            <div class="options en-text" id="options-container"></div>

            <div class="rationale ar-text" id="rationale-container">
                <div class="rationale-title">💡 الشرح:</div>
                <div id="rationale-text"></div>
            </div>

            <div class="nav-buttons en-text">
                <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">⬅️ Previous</button>
                <button class="nav-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
            </div>
        </div>

        <div class="result-container" id="result-container">
            <h2 style="font-size: 32px; margin-bottom: 20px; color: white;">Exam Completed!</h2>
            <div style="font-size: 24px; margin-bottom: 30px; display: flex; flex-direction: column; gap: 10px; align-items: center;">
                <p>Final Score: <span id="final-score" style="color: var(--neon-blue); font-weight: bold;"></span> / 136</p>
                <p class="correct-text">✅ Correct: <span id="final-correct"></span></p>
                <p class="wrong-text">❌ Wrong: <span id="final-wrong"></span></p>
            </div>
            <button class="nav-btn show en-text" style="background: transparent; border: 2px solid var(--neon-blue); color: var(--neon-blue); width: 100%;" onclick="location.reload()">Try Again</button>
        </div>
    </div>

    <script>
        const questions = [
            // ================= الجزء الأول: 40 سؤال من كويزات الفيديو (الجبر الخطي فقط) =================
            { q: "1. Which field heavily relies on linear algebra?", o: ["Computer graphics", "Physics", "Machine learning", "All of the above"], a: 3, r: "الجبر الخطي هو الأساس الرياضي في مجالات الجرافيكس، الفيزياء، وتعلم الآلة." },
            { q: "2. Which concept is NOT related to linear algebra?", o: ["Matrix inversion", "Gaussian elimination", "Fourier Transform", "Eigenvectors"], a: 2, r: "تحويل فورييه يرتبط بالتحليل الدالي ومعالجة الإشارات وليس الجبر الخطي بشكل مباشر." },
            { q: "3. In which field is the concept of eigenvalues used?", o: ["Quantum Computing", "Machine Learning", "Physics", "All of the above"], a: 3, r: "القيم الذاتية لها تطبيقات واسعة في ميكانيكا الكم، خوارزميات تعلم الآلة، والفيزياء." },
            { q: "4. True or False: The sum of the eigenvalues of a matrix equals its trace (sum of diagonal elements).", o: ["True", "False"], a: 0, r: "من الخصائص الأساسية للمصفوفات المربعة أن مجموع قيمها الذاتية يساوي مجموع عناصر قطرها الرئيسي." },
            { q: "5. What is the characteristic polynomial of a matrix A?", o: ["A - λI", "λA - I", "det(A - λI)", "A + λI"], a: 2, r: "تُحسب كثيرة الحدود المميزة بإيجاد محدد (A - λI)." },
            { q: "6. What is linear algebra primarily concerned with?", o: ["Numbers and probability", "Calculus and differentiation", "Geometry and topology", "Vectors and matrices"], a: 3, r: "الجبر الخطي يدرس الفضاءات الاتجاهية، المتجهات، والمصفوفات." },
            { q: "7. What is an application of eigenvalues and eigenvectors?", o: ["Finding limits in calculus", "PageRank algorithm", "Solving quadratic equations", "Evaluating definite integrals"], a: 1, r: "خوارزمية PageRank الخاصة بجوجل تعتمد بشكل أساسي على حساب المتجهات الذاتية." },
            { q: "8. What is the equation used to find eigenvalues?", o: ["A + λI = 0", "Aλ = 0", "Ax = xA", "det(A - λI) = 0"], a: 3, r: "لإيجاد القيم الذاتية، يجب أن ينعدم محدد المصفوفة (A - λI)." },
            { q: "9. True or False: Eigenvalues are only defined for square matrices.", o: ["True", "False"], a: 0, r: "المعادلة المميزة تتطلب حساب المحدد، والمحددات مُعرفة فقط للمصفوفات المربعة." },
            { q: "10. What is an eigenvalue?", o: ["A matrix determinant", "A matrix inverse", "A scalar that scales an eigenvector", "A random number"], a: 2, r: "القيمة الذاتية هي رقم (كمية قياسية) يحدد مقدار التمدد أو الانكماش للمتجه الذاتي." },
            { q: "11. What is the eigenvalue equation?", o: ["Aλ = x", "A + λx = 0", "Ax = λx", "λx = A"], a: 2, r: "تأثير المصفوفة A على المتجه الذاتي x يعادل ضرب المتجه في القيمة الذاتية λ." },
            { q: "12. Which of the following is a real-world application of eigenvalues?", o: ["Google PageRank", "Image processing", "Vibration analysis", "All of the above"], a: 3, r: "كل هذه التطبيقات تعتمد بشكل أساسي على تحليل القيم الذاتية لحل المشاكل الهندسية والبرمجية." },
            { q: "13. What is a basis in linear algebra?", o: ["A set of dependent vectors", "A random collection of vectors", "A set of linearly independent vectors that span a vector space", "A zero vector"], a: 2, r: "الأساس (Basis) هو مجموعة متجهات مستقلة خطياً وتستطيع توليد (span) الفضاء بالكامل." },
            { q: "14. Which mathematical concept is used to find eigenvectors?", o: ["Gaussian elimination", "Fourier transform", "Matrix addition", "Solving (A - λI)x = 0"], a: 3, r: "بعد معرفة القيمة الذاتية λ، نقوم بحل هذا النظام المتجانس لإيجاد المتجه x." },
            { q: "15. True or False: The eigenvector of a matrix can be the zero vector.", o: ["True", "False"], a: 1, r: "خطأ، التعريف الرياضي ينص على أن المتجه الذاتي يجب أن يكون متجهاً غير صفري." },
            { q: "16. What is an eigenvector?", o: ["A zero vector", "A diagonal matrix", "A vector that does not change direction under transformation", "A unit vector"], a: 2, r: "المتجه الذاتي يحافظ على اتجاهه عند تطبيق التحويل الخطي عليه، ويتغير طوله فقط." },
            { q: "17. What is the primary use of eigenvalues?", o: ["Adding matrices", "Solving non-linear equations", "Describing how linear transformations affect vectors", "Finding vector length"], a: 2, r: "تُستخدم القيم الذاتية لوصف سلوك التحويلات الخطية وتأثيرها على المتجهات بتبسيط." },
            { q: "18. The eigenvalue equation results in a system of:", o: ["Random numbers", "Nonlinear equations", "Quadratic equations", "Linear equations"], a: 3, r: "المعادلة تؤدي إلى نظام من المعادلات الخطية المتجانسة التي نحلها لإيجاد المتجه الذاتي." },
            { q: "19. True or False: A system of linear equations can be solved using matrix methods.", o: ["True", "False"], a: 0, r: "المصفوفات هي الأداة الأساسية لحل أنظمة المعادلات الخطية بكفاءة (مثل الحذف الغاوسي)." },
            { q: "20. True or False: Eigenvectors change direction after a transformation.", o: ["True", "False"], a: 1, r: "خطأ، من أهم خصائص المتجه الذاتي أنه لا يغير اتجاهه، بل يتمدد أو ينكمش فقط." },
            { q: "21. True or False: Eigenvectors of different eigenvalues are always orthogonal.", o: ["True", "False"], a: 1, r: "خطأ، هذا الشرط يتحقق دائماً في المصفوفات المتماثلة (Symmetric) فقط، وليس في كل المصفوفات." },
            { q: "22. What is the first step in computing eigenvalues?", o: ["Solve (A - λI)x = 0", "Perform Gaussian elimination", "Find the roots of the characteristic equation", "Compute the determinant of A"], a: 2, r: "الخطوة الأولى هي إيجاد جذور المعادلة المميزة عن طريق حل det(A - λI) = 0." },
            { q: "23. True or False: In quantum mechanics, eigenvalues represent measurable quantities like energy levels.", o: ["True", "False"], a: 0, r: "صحيح، في ميكانيكا الكم، الحالات الذاتية والقيم الذاتية تمثل مستويات الطاقة والمقادير القابلة للقياس." },
            { q: "24. What does λ represent in the eigenvalue equation Ax = λx?", o: ["A matrix determinant", "A scalar eigenvalue", "A unit vector", "A zero vector"], a: 1, r: "الرمز λ يمثل القيمة الذاتية، وهي كمية قياسية (رقم)." },
            { q: "25. True or False: Eigenvectors corresponding to the same eigenvalue are unique.", o: ["True", "False"], a: 1, r: "خطأ، أي مضاعف للمتجه الذاتي يعتبر أيضاً متجه ذاتي لنفس القيمة، لذا فهي ليست وحيدة." },
            { q: "26. Adding a multiple of one row to another row is called:", o: ["Elimination", "Matrix swap", "Row replacement", "Replacement"], a: 2, r: "هذه العملية تسمى استبدال الصفوف (Row replacement) وتستخدم في تبسيط المصفوفات." },
            { q: "27. Which method is commonly used to solve systems of equations?", o: ["Elimination", "Differentiation", "Substitution", "Elimination and Substitution"], a: 3, r: "الحذف والتعويض هما الطريقتان الأساسيتان لحل أنظمة المعادلات جبرياً." },
            { q: "28. A system with no solution is called:", o: ["Consistent", "Dependent", "Linear", "Inconsistent"], a: 3, r: "النظام غير المتوافق (Inconsistent) هو النظام الذي لا يحتوي على أي حل يرضي جميع المعادلات." },
            { q: "29. Which field heavily relies on linear algebra?", o: ["Machine learning", "Computer graphics", "Physics", "All of the above"], a: 3, r: "الجبر الخطي يدخل في تعلم الآلة والفيزياء والجرافيكس." },
            { q: "30. In which field is the concept of eigenvalues used?", o: ["Physics", "Machine Learning", "Quantum Computing", "All of the above"], a: 3, r: "القيم الذاتية تستخدم في مجالات علمية دقيقة متعددة." },
            { q: "31. Solving a system of equations means finding:", o: ["Only x value", "Only y value", "Only one solution", "The solution set"], a: 3, r: "الحل يعني إيجاد مجموعة الحلول الكاملة (The solution set) التي تحقق جميع المعادلات معاً." },
            { q: "32. True or False: A system of linear equations can be solved using matrix methods.", o: ["True", "False"], a: 0, r: "صحيح، طرق مثل معكوس المصفوفة أو حذف غاوس تستخدم لحل هذه الأنظمة." },
            { q: "33. If a system is consistent, it has:", o: ["No solution", "Exactly two solutions", "Only infinite solutions", "At least one solution"], a: 3, r: "النظام المتوافق (Consistent) إما أن يكون له حل وحيد أو عدد لانهائي من الحلول." },
            { q: "34. The eigenvalue equation results in a system of:", o: ["Random numbers", "Quadratic equations", "Nonlinear equations", "Linear equations"], a: 3, r: "المعادلة تؤدي لنظام من المعادلات الخطية." },
            { q: "35. What is the equation used to find eigenvalues?", o: ["A + λI = 0", "Aλ = 0", "Ax = xA", "det(A - λI) = 0"], a: 3, r: "المعادلة الأساسية للقيم الذاتية هي مساواة المحدد بالصفر." },
            { q: "36. Interchanging two rows in a matrix is called:", o: ["Rotation", "Shift", "Reduction", "Swap"], a: 3, r: "تبديل صفين ببعضهما يُعرف بعملية الـ Swap." },
            { q: "37. Which method is used to compute eigenvalues for large matrices?", o: ["Matrix multiplication", "Gaussian elimination", "Determinant calculation", "Power Iteration Method"], a: 3, r: "طريقة القوة التكرارية (Power Iteration) تستخدم برمجياً لإيجاد القيم الذاتية للمصفوفات الضخمة بكفاءة." },
            { q: "38. Which of the following methods is used to compute eigenvalues?", o: ["Integration", "Matrix multiplication", "Gaussian elimination", "Determinant approach"], a: 3, r: "نظرياً، إيجاد المحددات (Determinant approach) هو الطريقة الكلاسيكية لحساب القيم الذاتية." },
            { q: "39. A solution of a system of linear equations is:", o: ["A number", "A vector only", "A matrix", "A list of numbers satisfying all equations"], a: 3, r: "الحل هو مجموعة (قائمة) من الأرقام للمتغيرات تجعل كل معادلات النظام صحيحة." },
            { q: "40. Which of the following is a real-world application of eigenvalues?", o: ["Image processing", "Google PageRank", "Vibration analysis", "All of the above"], a: 3, r: "تأكيد على أهمية القيم الذاتية في الحياة الواقعية والبرمجة." },

            // ================= الجزء الثاني: 40 سؤال من امتحان الفاينل بالصور =================
            { q: "41. A matrix X for solving the equation 3X + A = B, where A = [1, -2; 0, 3], B = [-3, 4; 2, 1] is:", o: ["[ -4/3, 2 ; 2/3, -2/3 ]", "[ -4/3, 2 ; 3, -2/3 ]", "[ 4/3, 2 ; 2/3, -2/3 ]", "[ 4/3, 2 ; 3, 3 ]"], a: 0, r: "بحساب 3X = B - A ينتج المصفوفة [-4, 6 ; 2, -2]. بالقسمة على 3 لكل عنصر نحصل على الخيار الأول." },
            { q: "42. Which of the vectors below are scalar multiples of z = (1/2, -2/3, 3/4)?", o: ["u = (-1, 4/3, -3/2)", "v = (6, -4, 9)", "w = (12, 0, 9)", "None of these"], a: 0, r: "بضرب المتجه z في المعامل القياسي (-2) نحصل تماماً على المتجه u." },
            { q: "43. The value of the determinant | 1+x, 1, 1 | 1, 1+x, 1 | 1, 1, 1+x | equal to:", o: ["x²(x+3)", "x³", "3x³", "0"], a: 0, r: "بتبسيط المحدد (بإضافة الأعمدة وطرح الصفوف) ينتج المقدار x²(x+3)." },
            { q: "44. The eigenvalues of the matrix A = [1, 4; 2, 3] are:", o: ["-1, 5", "1, 5", "5, -1", "5, 1"], a: 2, r: "مجموع القيم الذاتية يساوي أثر المصفوفة (1+3=4)، وحاصل ضربهم يساوي المحدد (3-8=-5). القيمتان اللتان تحققان ذلك هما 5 و -1." },
            { q: "45. The inverse matrix of A, where A = [1, -2; 0, 3] is:", o: ["[1, 0; 2, 3]", "[1, 0; -2/3, 1/3]", "[1, -2/3; 0, 1/3]", "[1, 2/3; 0, 1/3]"], a: 3, r: "معكوس المصفوفة 2x2 يُحسب بتبديل عناصر القطر الرئيسي وعكس إشارة القطر الآخر، ثم القسمة على المحدد (وهو 3)." },
            { q: "46. The set of vectors S = {(1,2), (2,4)} is ............... in R²", o: ["Linearly dependent", "Linearly independent", "Neither linearly dependent nor linearly independent", "None of these"], a: 0, r: "بما أن المتجه الثاني هو مضاعف للمتجه الأول (2 × (1,2) = (2,4))، فالمجموعة مرتبطة خطياً (Linearly dependent)." },
            { q: "47. If A, B are matrices, where A = [2, 1, -2; -1, 0, 3; 0, -2, 1], B = [3, 1; 2, -1; 3, 0], then (AB)^T equal to:", o: ["[2, 6, -1 ; 1, -1, 2]", "[2, 6, 1 ; 1, -1, 2]", "[2, 6, -1 ; 1, 1, 2]", "[2, 6, -1 ; -1, -1, -2]"], a: 0, r: "بعد ضرب المصفوفتين A و B، نقوم بعملية التدوير (Transpose) بتبديل الصفوف بالأعمدة لنحصل على الخيار الأول." },
            { q: "48. A system of linear equations x - 2y + 3z = 9 , y + 3z = 5 , z = 2 has a solution (x, y, z) = .........", o: ["(1, -1, 2)", "(-1, 1, 2)", "(1, 1, 2)", "(11, -1, 2)"], a: 0, r: "بالتعويض العكسي: z=2، إذن y + 6 = 5 ومنها y = -1. بالتعويض في المعادلة الأولى نجد أن x = 1." },
            { q: "49. If A, B are matrices, where A = [1, 0; 0, 0] , B = [0, 0; 0, 1] , then A+B is called........", o: ["singular", "nonsingular", "neither singular nor nonsingular", "None of these"], a: 1, r: "جمع المصفوفتين يعطي مصفوفة الوحدة I. محدد مصفوفة الوحدة = 1 (لا يساوي صفر)، إذن هي غير شاذة (nonsingular)." },
            { q: "50. If A = [beta, 0; 1, 1] and B = [1, 0; 5, 1] such that A² = B, then beta equal to .......", o: ["1", "-1", "4", "None of these"], a: 3, r: "بتربيع المصفوفة A ومساواتها بـ B نجد تناقضاً (beta² = 1 بينما beta+1 = 5)، لذا لا توجد قيمة لـ beta تحقق المعادلة." },
            { q: "51. The eigenvector corresponding the eigenvalue λ=5 of the matrix A = [1, 4; 2, 3] is .........", o: ["[-1; 1]", "[1; 1]", "[1; 0]", "None of these"], a: 1, r: "بحل النظام (A - 5I)X = 0 ينتج المعادلة -4x + 4y = 0، مما يعني x = y، المتجه [1; 1] يحقق ذلك." },
            { q: "52. Which of the vectors below are scalar multiples of z = (3, 2, -5)", o: ["u = (2, 4/3, -10/3)", "v = (6, 4, 10)", "w = (-6, -4, 10)", "None of these"], a: 0, r: "بضرب المتجه z في (2/3) نحصل تماماً على المتجه u." },
            { q: "53. If A and B are matrices, then (A^T B^T)^T = .........", o: ["B^T A^T", "A B", "(B A)^T", "B A"], a: 3, r: "حسب خصائص المصفوفات، مدور حاصل الضرب يساوي حاصل ضرب المدورات بترتيب عكسي، لذا ينتج B A." },
            { q: "54. The set of vectors M = {(1,2,3), (0,1,2), (-2,0,1)} is ............... in R³", o: ["Linearly dependent", "Linearly independent", "Neither linearly dependent nor linearly independent", "None of these"], a: 1, r: "بحساب محدد المصفوفة المكونة من هذه المتجهات نجد أنه لا يساوي صفراً، إذن هي مستقلة خطياً." },
            { q: "55. A value of c for which the system of equations is consistent: x+y=1 , (c-2)x+(c+4)y=6 , (c+2)²x+(c+4)²y=36 is .........", o: ["1", "2", "-2", "None of these"], a: 1, r: "بالتعويض بـ c=2 نجد أن المعادلات تتوافق وتتقاطع عند النقطة (0, 1)." },
            { q: "56. The eigenvalues of the matrix A = [1, 2, -2; 1, 2, 1; -1, -1, 0] are ...........", o: ["-1, 1, 3", "1, 1, 3", "1, 1, -3", "None of these"], a: 0, r: "مجموع القيم الذاتية يجب أن يساوي الأثر (Trace = 3) وحاصل ضربها يساوي المحدد (-3). الخيار الأول هو الوحيد الذي يحقق ذلك." },
            { q: "57. The value of the matrix A = [2, 3, -1; 0, -1, 2; 0, 0, 3] equal to......... (meaning Determinant)", o: ["-6", "6", "1/6", "None of these"], a: 0, r: "محدد المصفوفة المثلثية العليا يساوي حاصل ضرب عناصر قطرها الرئيسي (2 × -1 × 3 = -6)." },
            { q: "58. If the determinant | a+x, a, x | a-x, a, x | a-x, a, -x | = 0, then x equal to.........", o: ["0", "2a", "a", "3a"], a: 0, r: "بتبسيط المحدد نجد أنه يساوي -4ax² = 0، وبالتالي x = 0." },
            { q: "59. If A and B are matrices, then (A^T + B)^T = .........", o: ["A + B^T", "B + A^T", "A^T + B^T", "None of these"], a: 0, r: "مدور المجموع يساوي مجموع المدورات، ومدور المدور يرجع المصفوفة لأصلها، إذن النتيجة A + B^T." },
            { q: "60. The eigenvector corresponding the eigenvalue λ=1 of the matrix A = [1, 2, -2; 1, 2, 1; -1, -1, 0] is .........", o: ["[-2; 1; 1]", "[2; -1; 1]", "[-2; 1; -1]", "None of these"], a: 0, r: "بحل النظام المتجانس (A - I)X = 0 نجد أن المتجه هو [-2; 1; 1]." },
            { q: "61. If determinant | a+x, a-x, a-x | a-x, a+x, a-x | a-x, a-x, a+x | = 0, then x equal to.........", o: ["0", "2a", "a", "3a"], a: 3, r: "بجمع جميع الأعمدة على العمود الأول نجد أن (3a-x) عامل مشترك، بمساواته بالصفر ينتج x = 3a." },
            { q: "62. If the matrix A = [1, 3; 0, -2; -2, -1], then AA^T equal to .........", o: ["[10, -6, -5; -6, 4, 2; -5, 2, 5]", "[10, -6, -5; 6, 4, 2; 5, 2, 5]", "[10, 6, -5; -6, 4, 2; -5, 2, 5]", "[10, -6, 5; -6, 4, 2; -5, 2, 5]"], a: 0, r: "بضرب المصفوفة A في مدورها A^T ينتج مصفوفة 3x3 قيمها مطابقة للخيار الأول." },
            { q: "63. The eigenvector corresponding the eigenvalue λ=-1 of the matrix A = [1, 4; 2, 3] is .........", o: ["[2; 1]", "[-2; 1]", "[2; -1]", "None of these"], a: 1, r: "بحل النظام (A + I)X = 0 ينتج 2x + 4y = 0، مما يعني x = -2y. المتجه [-2; 1] يحقق ذلك." },
            { q: "64. The eigenvector corresponding the eigenvalue λ=-1 of the matrix A = [1, 2, -2; 1, 2, 1; -1, -1, 0] is .........", o: ["[-2; -1; 1]", "[2; -1; 1]", "[-2; 1; 1]", "None of these"], a: 1, r: "بحل النظام (A + I)X = 0 نستنتج أن المتجه الذي يرضي جميع المعادلات هو [2; -1; 1]." },
            { q: "65. The eigenvector corresponding the eigenvalue λ=3 of the matrix A = [1, 2, -2; 1, 2, 1; -1, -1, 0] is .........", o: ["[-2; -1; 1]", "[2; -1; 1]", "[-2; 1; 1]", "None of these"], a: 0, r: "بحل النظام (A - 3I)X = 0، المتجه الناتج هو [-2; -1; 1]." },
            { q: "66. True/False: The product of the lower triangular matrices is not lower triangular matrix.", o: ["True", "False"], a: 1, r: "خطأ. حاصل ضرب أي مصفوفتين مثلثيتين سفليتين ينتج دائماً مصفوفة مثلثية سفلية." },
            { q: "67. True/False: The inverse of the matrix exists, it is not unique.", o: ["True", "False"], a: 1, r: "خطأ. المعكوس الضربي للمصفوفة (إن وُجد) يكون دائماً فريداً (Unique)." },
            { q: "68. True/False: The product of matrices satisfies the commutative law.", o: ["True", "False"], a: 1, r: "خطأ. ضرب المصفوفات بشكل عام ليس إبدالياً (AB لا تساوي BA دائماً)." },
            { q: "69. True/False: A square matrix of size nxn can be written as the product of a lower triangular matrix and an upper triangular matrix.", o: ["True", "False"], a: 0, r: "صحيح. يُعرف هذا بتحليل LU (LU Decomposition)." },
            { q: "70. True/False: The intersection of two subspaces of vector space is not subspace.", o: ["True", "False"], a: 1, r: "خطأ. تقاطع أي فضاءين جزئيين يشكل دائماً فضاءً جزئياً." },
            { q: "71. True/False: The sum of matrices satisfies the commutative law, if the matrices have the same size.", o: ["True", "False"], a: 0, r: "صحيح. جمع المصفوفات عملية إبدالية (A+B = B+A)." },
            { q: "72. True/False: The homogeneous system of equations has only trivial solution, if the matrix coefficient has invertible.", o: ["True", "False"], a: 0, r: "صحيح. إذا كانت مصفوفة المعاملات قابلة للانعكاس، فالحل الوحيد هو الحل الصفري البديهي." },
            { q: "73. True/False: For a vector space Rⁿ, the additive identity is unique.", o: ["True", "False"], a: 0, r: "صحيح. المحايد الجمعي (المتجه الصفري) يكون دائماً فريداً في أي فضاء اتجاهي." },
            { q: "74. True/False: The set of all integers with standard operations forms a vector space.", o: ["True", "False"], a: 1, r: "خطأ. مجموعة الأعداد الصحيحة ليست مغلقة تحت عملية الضرب القياسي بأعداد حقيقية." },
            { q: "75. True/False: The union of two subspaces of vector space is a subspace.", o: ["True", "False"], a: 1, r: "خطأ. اتحاد فضاءين جزئيين لا يكون فضاءً جزئياً إلا إذا كان أحدهما محتوى بالكامل داخل الآخر." },
            { q: "76. True/False: The non-homogeneous system of equations has an infinite solution, if the matrix coefficient has invertible.", o: ["True", "False"], a: 1, r: "خطأ. إذا كانت مصفوفة المعاملات قابلة للانعكاس، فإن النظام يكون له حل فريد (وحيد)." },
            { q: "77. True/False: The set of all linear combinations of a vector space forms a subspace.", o: ["True", "False"], a: 0, r: "صحيح. الامتداد الخطي (Span) لمجموعة من المتجهات يشكل دائماً فضاءً جزئياً." },
            { q: "78. True/False: The product of the upper triangular matrices is upper triangular matrix.", o: ["True", "False"], a: 0, r: "صحيح. ضرب مصفوفتين مثلثيتين عليويتين يعطي مصفوفة عليا." },
            { q: "79. True/False: The sum of two square singular matrices is a non singular matrix.", o: ["True", "False"], a: 1, r: "خطأ. ليس بالضرورة (المصفوفة الصفرية + المصفوفة الصفرية = مصفوفة صفرية وهي شاذة)." },
            { q: "80. True/False: A square matrix of size nxn cannot be written as the product of elementary matrices, if it invertible.", o: ["True", "False"], a: 1, r: "خطأ. العكس هو الصحيح؛ المصفوفة القابلة للانعكاس يمكن دائماً كتابتها كحاصل ضرب لمصفوفات أولية." },

            // ================= الجزء الثالث: 36 سؤال من ملف Linear_Algebra_Full_Question_Bank =================
            { q: "81. The imaginary unit i is defined as:", o: ["√1", "√-1", "-1", "0"], a: 1, r: "الوحدة التخيلية i تُعرف رياضياً بأنها الجذر التربيعي للعدد -1." },
            { q: "82. A complex number consists of:", o: ["Only real part", "Only imaginary part", "Real and imaginary parts", "Magnitude only"], a: 2, r: "العدد المركب يتكون دائماً من جزء حقيقي وجزء تخيلي." },
            { q: "83. The dot product of two vectors results in:", o: ["A vector", "A scalar", "A matrix", "A plane"], a: 1, r: "الضرب القياسي (Dot product) ينتج عنه كمية قياسية (رقم) وليس متجهاً." },
            { q: "84. If the dot product of two non-zero vectors is zero, the vectors are:", o: ["Parallel", "Opposite", "Perpendicular", "Equal"], a: 2, r: "إذا كان الضرب القياسي لمتجهين غير صفريين يساوي صفراً، فإنهما متعامدان (الزاوية 90)." },
            { q: "85. The cross product of two vectors gives:", o: ["Scalar", "Vector", "Matrix", "Tensor"], a: 1, r: "الضرب الاتجاهي (Cross product) ينتج عنه متجه جديد عمودي على المتجهين." },
            { q: "86. The magnitude of the cross product represents:", o: ["Length", "Angle", "Area of parallelogram", "Distance"], a: 2, r: "مقدار الضرب الاتجاهي يمثل مساحة متوازي الأضلاع الذي ضلعه المتجهان." },
            { q: "87. A matrix is invertible if and only if:", o: ["det(A)=0", "det(A)≠0", "A is rectangular", "A has equal rows"], a: 1, r: "المصفوفة تكون قابلة للانعكاس فقط إذا كان محددها لا يساوي صفراً." },
            { q: "88. The identity matrix acts as:", o: ["Zero element", "Multiplicative identity", "Inverse matrix", "Transpose"], a: 1, r: "مصفوفة الوحدة تعمل كمحايد ضربي للمصفوفات." },
            { q: "89. Eigenvalues are obtained by solving:", o: ["Ax=b", "A A", "det(A-λI)=0", "A+I"], a: 2, r: "القيم الذاتية تُحسب بجعل محدد (A - λI) يساوي صفراً." },
            { q: "90. Eigenvectors corresponding to an eigenvalue are:", o: ["Unique", "Always zero", "Not unique", "Orthogonal always"], a: 2, r: "المتجهات الذاتية ليست فريدة، أي مضاعف للمتجه هو أيضاً متجه ذاتي." },
            { q: "91. Uniform scaling means:", o: ["Sx ≠ Sy", "Sx=Sy", "Only x scaled", "Only y scaled"], a: 1, r: "التحجيم المنتظم يعني أن معامل التكبير/التصغير في محور X يساوي المعامل في محور Y." },
            { q: "92. Translation in homogeneous coordinates uses:", o: ["2x2 matrix", "3x3 matrix", "Identity only", "Rotation matrix"], a: 1, r: "الانسحاب في الإحداثيات المتجانسة الثنائية الأبعاد يتطلب مصفوفة 3x3 للتمثيل بالضرب." },
            { q: "93. Rotation matrix preserves:", o: ["Area only", "Length and angles", "Orientation only", "Position"], a: 1, r: "مصفوفة الدوران تحافظ على الأطوال والزوايا بين المتجهات دون تشويه." },
            { q: "94. Order of composite transformations is:", o: ["Commutative", "Does not matter", "Important", "Always fixed"], a: 2, r: "ترتيب التحويلات مهم جداً لأن ضرب المصفوفات ليس إبدالياً." },
            { q: "95. MediaPipe represents computation as:", o: ["Sequential code", "Pipeline graph", "Tree structure", "Linear list"], a: 1, r: "ميديا بايب تمثل العمليات الحسابية كـ Pipeline graph (رسم بياني خطي)." },
            { q: "96. MediaPipe basic data unit is called:", o: ["Node", "Stream", "Packet", "Tensor"], a: 2, r: "الوحدة الأساسية للبيانات التي تنتقل في MediaPipe تسمى Packet." },
            { q: "97. GPU is best suited for:", o: ["Sequential processing", "Parallel matrix operations", "Text processing", "File management"], a: 1, r: "كروت الشاشة (GPU) مصممة للعمليات المتوازية السريعة مثل ضرب المصفوفات." },
            { q: "98. TPU is optimized mainly for:", o: ["Graphics rendering", "General computing", "Deep learning tensor operations", "Operating systems"], a: 2, r: "وحدات TPU مخصصة لتسريع عمليات الـ Tensors في نماذج التعلم العميق." },
            { q: "99. True/False: The square root of a negative number is not defined in real numbers.", o: ["True", "False"], a: 0, r: "صحيح، لأن الأعداد الحقيقية لا تحتوي على جذور سالبة، بل تنتمي للأعداد التخيلية." },
            { q: "100. True/False: i² = -1.", o: ["True", "False"], a: 0, r: "صحيح، هذا هو التعريف الأساسي للوحدة التخيلية." },
            { q: "101. True/False: The dot product of perpendicular vectors is zero.", o: ["True", "False"], a: 0, r: "صحيح، لأن الزاوية 90 و cos(90) = 0." },
            { q: "102. True/False: Cross product is defined in 2D only.", o: ["True", "False"], a: 1, r: "خطأ، الضرب الاتجاهي معرف بشكل أساسي في الفراغ ثلاثي الأبعاد (3D)." },
            { q: "103. True/False: A singular matrix has an inverse.", o: ["True", "False"], a: 1, r: "خطأ، المصفوفة الشاذة (Singular) محددها صفر ولا يوجد لها معكوس." },
            { q: "104. True/False: If det(A)=0 matrix A is not invertible.", o: ["True", "False"], a: 0, r: "صحيح، انعدام المحدد يعني عدم إمكانية إيجاد المعكوس." },
            { q: "105. True/False: Eigenvalues are defined only for square matrices.", o: ["True", "False"], a: 0, r: "صحيح، لأن حسابها يتطلب إيجاد محدد المصفوفة." },
            { q: "106. True/False: Eigenvectors can change direction after transformation.", o: ["True", "False"], a: 1, r: "خطأ، من خصائصها أنها لا تغير اتجاهها بل يتغير مقدارها فقط." },
            { q: "107. True/False: Translation changes the shape of an object.", o: ["True", "False"], a: 1, r: "خطأ، الانسحاب يغير الموقع فقط ويحافظ على الشكل والأبعاد." },
            { q: "108. True/False: Rotation preserves distances.", o: ["True", "False"], a: 0, r: "صحيح، الدوران هو تحويل صلب (Rigid) يحافظ على الأبعاد." },
            { q: "109. True/False: Scaling with factor less than 1 shrinks the object.", o: ["True", "False"], a: 0, r: "صحيح، الضرب في كسر أقل من 1 يقلل الحجم." },
            { q: "110. True/False: Homogeneous coordinates use an extra dimension.", o: ["True", "False"], a: 0, r: "صحيح، يتم إضافة إحداثي إضافي (1) لتسهيل ضرب مصفوفات الانسحاب." },
            { q: "111. True/False: Order of matrix multiplication does not matter.", o: ["True", "False"], a: 1, r: "خطأ، ضرب المصفوفات غير إبدالي، فالترتيب يغير النتيجة تماماً." },
            { q: "112. True/False: MediaPipe supports streaming data processing.", o: ["True", "False"], a: 0, r: "صحيح، هي مصممة لمعالجة تدفقات البيانات (Streams) مثل الفيديو المباشر." },
            { q: "113. True/False: MediaPipe nodes are also called calculators.", o: ["True", "False"], a: 0, r: "صحيح، العقد التي تقوم بالعمليات الحسابية فيها تسمى Calculators." },
            { q: "114. True/False: GPU has fewer cores than CPU.", o: ["True", "False"], a: 1, r: "خطأ، كروت الشاشة تحتوي على آلاف الأنوية الصغيرة مقارنة بأنوية المعالج القليلة." },
            { q: "115. True/False: TPU is general-purpose hardware.", o: ["True", "False"], a: 1, r: "خطأ، الـ TPU مخصص حصرياً لتسريع عمليات التعلم الآلي والشبكات العصبية." },
            { q: "116. True/False: Cross product direction follows the right-hand rule.", o: ["True", "False"], a: 0, r: "صحيح، اتجاه المتجه الناتج يحدد دائماً بقاعدة اليد اليمنى." },

            // ================= الجزء الرابع: 20 سؤال من ملف Linear_Algebra_Advanced_Question_Bank =================
            { q: "117. If A is an invertible matrix, which statement is always true?", o: ["A has dependent columns", "Ax=0 has a non-trivial solution", "rank(A) = number of columns of A", "det(A)=0"], a: 2, r: "المصفوفة القابلة للانعكاس يكون رتبتها (Rank) مساوياً لعدد أعمدتها (Full rank)." },
            { q: "118. If λ is an eigenvalue of matrix A, then which is an eigenvalue of A⁻¹?", o: ["λ", "1/λ", "-λ", "λ²"], a: 1, r: "القيمة الذاتية لمعكوس المصفوفة هي مقلوب القيمة الذاتية للمصفوفة الأصلية (1/λ)." },
            { q: "119. Two vectors have a dot product equal to the product of their magnitudes. The angle between them is:", o: ["0°", "90°", "180°", "45°"], a: 0, r: "بما أن cos(θ) = 1، إذن الزاوية بينهما 0 درجة (متوازيان في نفس الاتجاه)." },
            { q: "120. The cross product of two parallel vectors is:", o: ["Maximum", "Minimum", "Zero vector", "Unit vector"], a: 2, r: "الضرب الاتجاهي لمتجهين متوازيين يساوي المتجه الصفري لأن sin(0) = 0." },
            { q: "121. A 2D transformation that preserves shape but changes orientation is:", o: ["Scaling", "Translation", "Rotation", "Reflection"], a: 3, r: "الانعكاس (Reflection) يحافظ على الشكل ولكنه يعكس الاتجاه (Orientation)." },
            { q: "122. Which transformation cannot be represented using a 2x2 matrix alone?", o: ["Rotation", "Scaling", "Shearing", "Translation"], a: 3, r: "الانسحاب (Translation) يحتاج إلى إحداثيات متجانسة ومصفوفة 3x3 لتمثيله بالضرب." },
            { q: "123. If det(A) < 0, the linear transformation represented by A:", o: ["Preserves orientation", "Reverses orientation", "Collapses space", "Is not invertible"], a: 1, r: "المحدد السالب يعني أن التحويل يعكس الاتجاه (Reverses orientation) للفضاء." },
            { q: "124. If eigenvalues of A are 2 and 5, eigenvalues of 3A are:", o: ["2 and 5", "6 and 15", "5 and 2", "1 and 3"], a: 1, r: "عند ضرب المصفوفة في ثابت، تُضرب القيم الذاتية في نفس الثابت (3 × 2 = 6، و 3 × 5 = 15)." },
            { q: "125. In homogeneous coordinates, the extra coordinate allows:", o: ["Scaling only", "Rotation only", "Translation as matrix multiplication", "Reflection only"], a: 2, r: "الإحداثي الإضافي يسمح بتمثيل الانسحاب كعملية ضرب مصفوفات بدلاً من عملية جمع." },
            { q: "126. In MediaPipe graphs, parallel execution is possible because:", o: ["Packets are mutable", "Calculators are independent nodes", "Streams block execution", "There is only one thread"], a: 1, r: "العقد (Calculators) تعمل بشكل مستقل تماماً، مما يسمح بتنفيذها على التوازي لزيادة السرعة." },
            { q: "127. True/False: If A and B are invertible, then (AB)⁻¹ = A⁻¹ B⁻¹.", o: ["True", "False"], a: 1, r: "خطأ، القاعدة الصحيحة هي (AB)⁻¹ = B⁻¹ A⁻¹ (الترتيب ينعكس)." },
            { q: "128. True/False: Eigenvectors corresponding to different eigenvalues are always linearly independent.", o: ["True", "False"], a: 0, r: "صحيح، هذه من أهم المبرهنات الأساسية في الجبر الخطي." },
            { q: "129. True/False: A zero vector can be an eigenvector.", o: ["True", "False"], a: 1, r: "خطأ، المتجه الذاتي يجب أن يكون متجهاً غير صفري (Non-zero) حسب التعريف." },
            { q: "130. True/False: The dot product can be used to find the angle between vectors.", o: ["True", "False"], a: 0, r: "صحيح، باستخدام قانون جيب التمام للضرب القياسي." },
            { q: "131. True/False: The magnitude of a cross product equals the area of a triangle formed by the vectors.", o: ["True", "False"], a: 1, r: "خطأ، المقدار يمثل مساحة متوازي الأضلاع كاملاً، وليس المثلث (المثلث هو النصف)." },
            { q: "132. True/False: A reflection matrix has determinant -1.", o: ["True", "False"], a: 0, r: "صحيح، لأنها تعكس اتجاه الفضاء." },
            { q: "133. True/False: Non-uniform scaling changes both shape and size.", o: ["True", "False"], a: 0, r: "صحيح، التحجيم غير المنتظم يغير الأبعاد بنسب مختلفة مما يؤدي لتشوه الشكل." },
            { q: "134. True/False: Translation affects vector magnitude.", o: ["True", "False"], a: 1, r: "خطأ، الانسحاب يغير فقط مكان (موقع) الشكل، ولا يغير طول أي متجه فيه." },
            { q: "135. True/False: MediaPipe supports only batch processing.", o: ["True", "False"], a: 1, r: "خطأ، ميديا بايب تدعم معالجة البيانات المتدفقة (Streaming) بكفاءة عالية للفيديو الحي." },
            { q: "136. True/False: TPU is more energy-efficient than GPU for deep learning tasks.", o: ["True", "False"], a: 0, r: "صحيح، وحدات الـ TPU مصممة خصيصاً للذكاء الاصطناعي وتستهلك طاقة أقل لإنجاز نفس المهام مقارنة بـ GPU." }
        ];

        let currentQuestion = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let userAnswers = new Array(questions.length).fill(null);

        function loadQuestion() {
            document.getElementById('rationale-container').classList.remove('show');
            document.getElementById('question-tracker').innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
            document.getElementById('question-text').innerText = questions[currentQuestion].q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            questions[currentQuestion].o.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(index);
                
                if (userAnswers[currentQuestion] !== null) {
                    btn.disabled = true;
                    if (index === questions[currentQuestion].a) {
                        btn.classList.add('correct');
                    } else if (index === userAnswers[currentQuestion]) {
                        btn.classList.add('wrong');
                    }
                }
                
                optionsContainer.appendChild(btn);
            });
            
            if (userAnswers[currentQuestion] !== null) {
                document.getElementById('rationale-text').innerText = questions[currentQuestion].r;
                document.getElementById('rationale-container').classList.add('show');
            }
            
            document.getElementById('prev-btn').style.display = currentQuestion > 0 ? 'block' : 'none';
            document.getElementById('prev-btn').classList.add('show');
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.add('show');
            if (currentQuestion === questions.length - 1) {
                nextBtn.innerText = 'Finish Exam ➔';
            } else {
                nextBtn.innerText = 'Next Question ➔';
            }
        }

        function selectAnswer(index) {
            if (userAnswers[currentQuestion] !== null) return;
            
            userAnswers[currentQuestion] = index;
            const correctIndex = questions[currentQuestion].a;
            const btns = document.querySelectorAll('.option-btn');
            
            btns.forEach(btn => btn.disabled = true);
            btns[correctIndex].classList.add('correct');
            
            if (index === correctIndex) {
                correctCount++;
            } else {
                btns[index].classList.add('wrong');
                wrongCount++;
            }
            
            document.getElementById('correct-tracker').innerText = `✅ Correct: ${correctCount}`;
            document.getElementById('wrong-tracker').innerText = `❌ Wrong: ${wrongCount}`;
            
            document.getElementById('rationale-text').innerText = questions[currentQuestion].r;
            document.getElementById('rationale-container').classList.add('show');
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function showResults() {
            document.getElementById('quiz-content').style.display = 'none';
            const resultContainer = document.getElementById('result-container');
            resultContainer.classList.add('show');
            
            document.getElementById('final-score').innerText = correctCount;
            document.getElementById('final-correct').innerText = correctCount;
            document.getElementById('final-wrong').innerText = wrongCount;
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
